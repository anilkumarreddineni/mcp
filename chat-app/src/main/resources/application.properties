spring.application.name=chat-app
server.port=8082

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=${ANTHROPIC_MODEL:claude-haiku-5-5}

spring.ai.mcp.client.name=chat-app
# Connect to mcp-server on first use instead of at startup, so chat-app starts even when it is down
spring.ai.mcp.client.initialized=false
spring.ai.mcp.client.streamable-http.connections.orders.url=${MCP_SERVER_URL:http://localhost:8080}
spring.ai.mcp.client.streamable-http.connections.orders.endpoint=/mcp

# Log every Claude API request and response (prompt, tool calls, tool results, reply).
# Includes what users type, so set to INFO to turn it off.
logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG

# Also write logs to a file (relative to where chat-app is started, normally chat-app/logs).
# Rotates at 10MB and keeps 7 days of history.
logging.file.name=logs/chat-app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
