<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Order Assistant</title>
	<style>
		:root {
			--bg: #f6f7f9;
			--surface: #ffffff;
			--text: #1c1f24;
			--muted: #6b7280;
			--border: #e3e5e8;
			--accent: #2f5bd3;
			--accent-text: #ffffff;
			--user-bubble: #2f5bd3;
			--user-text: #ffffff;
			--bot-bubble: #eef0f3;
			--error-bubble: #fdecec;
			--error-text: #9b1c1c;
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--bg: #15171b;
				--surface: #1d2025;
				--text: #e8eaed;
				--muted: #9aa0a8;
				--border: #2c3036;
				--accent: #6d8ff0;
				--accent-text: #0e1116;
				--user-bubble: #3f63c9;
				--user-text: #ffffff;
				--bot-bubble: #272b31;
				--error-bubble: #3a1f22;
				--error-text: #f4b4b4;
			}
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			background: var(--bg);
			color: var(--text);
			height: 100vh;
			display: flex;
			justify-content: center;
		}

		.app {
			width: 100%;
			max-width: 760px;
			display: flex;
			flex-direction: column;
			height: 100vh;
			background: var(--surface);
			border-left: 1px solid var(--border);
			border-right: 1px solid var(--border);
		}

		header {
			padding: 16px 20px;
			border-bottom: 1px solid var(--border);
		}

		header h1 {
			margin: 0;
			font-size: 18px;
		}

		header p {
			margin: 4px 0 0;
			font-size: 13px;
			color: var(--muted);
		}

		#messages {
			flex: 1;
			overflow-y: auto;
			padding: 20px;
			display: flex;
			flex-direction: column;
			gap: 12px;
		}

		.message {
			max-width: 80%;
			padding: 10px 14px;
			border-radius: 14px;
			line-height: 1.45;
			white-space: pre-wrap;
			word-wrap: break-word;
		}

		.message.user {
			align-self: flex-end;
			background: var(--user-bubble);
			color: var(--user-text);
			border-bottom-right-radius: 4px;
		}

		.message.bot {
			align-self: flex-start;
			background: var(--bot-bubble);
			border-bottom-left-radius: 4px;
		}

		.message.error {
			background: var(--error-bubble);
			color: var(--error-text);
		}

		.message.typing {
			color: var(--muted);
			font-style: italic;
		}

		.suggestions {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}

		.suggestions button {
			font: inherit;
			font-size: 13px;
			padding: 6px 12px;
			border-radius: 999px;
			border: 1px solid var(--border);
			background: transparent;
			color: var(--text);
			cursor: pointer;
		}

		form {
			display: flex;
			gap: 8px;
			padding: 16px 20px;
			border-top: 1px solid var(--border);
		}

		#input {
			flex: 1;
			font: inherit;
			padding: 10px 14px;
			border-radius: 10px;
			border: 1px solid var(--border);
			background: var(--bg);
			color: var(--text);
		}

		#input:focus {
			outline: 2px solid var(--accent);
			outline-offset: -1px;
		}

		#send {
			font: inherit;
			font-weight: 600;
			padding: 10px 18px;
			border: none;
			border-radius: 10px;
			background: var(--accent);
			color: var(--accent-text);
			cursor: pointer;
		}

		#send:disabled {
			opacity: 0.5;
			cursor: default;
		}

		@media (max-width: 600px) {
			.app {
				border: none;
			}

			#messages,
			header,
			form {
				padding-left: 16px;
				padding-right: 16px;
			}

			.message {
				max-width: 90%;
			}
		}
	</style>
</head>
<body>
	<div class="app">
		<header>
			<h1>Order Assistant</h1>
			<p>Ask about your orders in plain language.</p>
		</header>

		<div id="messages" aria-live="polite">
			<div class="message bot">Hi! I can look up orders and their status. What would you like to know?</div>
			<div class="suggestions" id="suggestions">
				<button type="button">What's the status of order 1003?</button>
				<button type="button">Show me all orders</button>
				<button type="button">Which orders have shipped?</button>
			</div>
		</div>

		<form id="chat-form">
			<input id="input" type="text" placeholder="Ask about an order..." autocomplete="off" aria-label="Message" required>
			<button id="send" type="submit">Send</button>
		</form>
	</div>

	<script>
		const messages = document.getElementById('messages');
		const form = document.getElementById('chat-form');
		const input = document.getElementById('input');
		const send = document.getElementById('send');
		const suggestions = document.getElementById('suggestions');

		function addMessage(text, ...classes) {
			const div = document.createElement('div');
			div.className = ['message', ...classes].join(' ');
			div.textContent = text;
			messages.appendChild(div);
			messages.scrollTop = messages.scrollHeight;
			return div;
		}

		async function sendMessage(text) {
			suggestions.remove();
			addMessage(text, 'user');
			input.value = '';
			input.disabled = true;
			send.disabled = true;
			const typing = addMessage('Thinking...', 'bot', 'typing');

			try {
				const response = await fetch('/api/chat', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ message: text })
				});
				const body = await response.json().catch(() => ({}));
				typing.remove();
				if (response.ok) {
					addMessage(body.reply, 'bot');
				}
				else {
					addMessage(body.reply || 'Something went wrong. Please try again.', 'bot', 'error');
				}
			}
			catch (error) {
				typing.remove();
				addMessage("Can't reach the chat service. Check your connection and try again.", 'bot', 'error');
			}
			finally {
				input.disabled = false;
				send.disabled = false;
				input.focus();
			}
		}

		form.addEventListener('submit', (event) => {
			event.preventDefault();
			const text = input.value.trim();
			if (text) {
				sendMessage(text);
			}
		});

		suggestions.querySelectorAll('button').forEach((button) => {
			button.addEventListener('click', () => sendMessage(button.textContent));
		});

		input.focus();
	</script>
</body>
</html>
