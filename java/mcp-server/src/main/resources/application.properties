spring.application.name=mcp-server

order-service.base-url=http://localhost:8081

spring.ai.mcp.server.name=order-mcp-server
spring.ai.mcp.server.protocol=streamable

# Write logs to a file (relative to where mcp-server is started, normally mcp-server/logs).
# Rotates at 10MB and keeps 7 days of history.
logging.file.name=logs/mcp-server.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
